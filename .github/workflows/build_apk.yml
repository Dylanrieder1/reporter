name: Build Release APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate pristine modern Android scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          python3 -c '
          import os

          # 1. 注入通讯录权限到 AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              perms = "    <uses-permission android:name=\"android.permission.READ_CONTACTS\" />\n    <uses-permission android:name=\"android.permission.WRITE_CONTACTS\" />\n"
              if "READ_CONTACTS" not in content:
                  content = content.replace("<application", perms + "    <application")
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 2. 统一主模块 compileSdk 为 36
          app_gradle = "android/app/build.gradle.kts"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  c = f.read()
              c = c.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              with open(app_gradle, "w", encoding="utf-8") as f:
                  f.write(c)

          # 3. 在 gradle.properties 中添加 suppress 标识
          prop_path = "android/gradle.properties"
          if os.path.exists(prop_path):
              with open(prop_path, "a", encoding="utf-8") as f:
                  f.write("\nandroid.suppressUnsupportedCompileSdk=36\n")

          # 4. 在根 build.gradle.kts 中为所有子模块统一升级 compileSdk 为 36
          root_gradle = "android/build.gradle.kts"
          sub_code = """
subprojects {
    afterEvaluate {
        val ext = project.extensions.findByName("android")
        if (ext != null) {
            try {
                ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
            } catch (_: Throwable) {
                try {
                    ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                } catch (_: Throwable) {}
            }
        }
    }
}
"""
          if os.path.exists(root_gradle):
              with open(root_gradle, "a", encoding="utf-8") as f:
                  f.write("\n" + sub_code + "\n")
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK for distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/contacts-importer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: contacts-importer-apk
          path: build/app/outputs/flutter-apk/contacts-importer.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "通讯录导入助手 v1.0.0 发布包"
          body: "🎉 Android 原生通讯录导入助手 APK 安装包，支持手机小号、部门、职位批量导入与来电显示优化！"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/contacts-importer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
