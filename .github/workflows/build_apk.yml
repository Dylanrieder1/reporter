name: Build Release APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test || true
        continue-on-error: true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy APK for easy naming
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/contacts-importer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: contacts-importer-apk
          path: build/app/outputs/flutter-apk/contacts-importer.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "通讯录导入助手 v1.0.0 发布包"
          body: "🎉 Android 原生通讯录导入助手 APK 安装包，支持手机小号、部门、职位批量导入与来电显示优化！"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/contacts-importer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
